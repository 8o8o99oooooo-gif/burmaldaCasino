<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NeonDrop Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0a14;
            --bg-grad: linear-gradient(135deg, #1a0033 0%, #001a33 100%);
            --accent-purple: #a855f7;
            --accent-cyan: #22d3ee;
            --accent-gold: #fbbf24;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #94a3b8;
            --rarity-common: #94a3b8;
            --rarity-rare: #3b82f6;
            --rarity-epic: #a855f7;
            --rarity-legendary: #fbbf24;
            --rarity-mythic: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            background-image: var(--bg-grad);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }
        .glow-purple { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
        .glow-cyan { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
        .glow-gold { box-shadow: 0 0 20px rgba(251, 191, 36, 0.3); }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 5px var(--accent-cyan); } 50% { box-shadow: 0 0 20px var(--accent-cyan), 0 0 40px var(--accent-purple); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .btn {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            color: white; border: none; padding: 12px 24px; border-radius: 12px;
            font-weight: 700; font-size: 16px; cursor: pointer; width: 100%;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); }
        .btn-gold { background: linear-gradient(135deg, var(--accent-gold), #f59e0b); color: #000; }
        .btn-green { background: linear-gradient(135deg, var(--accent-green), #16a34a); color: #fff; }

        .top-bar {
            position: sticky; top: 0; z-index: 100;
            padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(10, 10, 20, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-purple); display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid var(--accent-cyan); }
        .balance-box { text-align: right; }
        .balance { font-size: 20px; font-weight: 800; color: var(--accent-gold); display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
        .claim-timer { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .progress-bar { width: 100px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 4px; overflow: hidden; margin-left: auto; }
        .progress-fill { height: 100%; background: var(--accent-cyan); width: 0%; transition: width 0.3s linear; }

        .content { padding: 16px; animation: slideUp 0.3s ease; }
        .section-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .case-card { padding: 16px; text-align: center; cursor: pointer; transition: transform 0.2s; position: relative; overflow: hidden; }
        .case-card:active { transform: scale(0.95); }
        .case-icon { font-size: 48px; margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); animation: float 3s ease-in-out infinite; }
        .case-price { font-weight: 700; color: var(--accent-gold); font-size: 18px; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .game-card { padding: 20px; text-align: center; cursor: pointer; border: 1px solid var(--glass-border); }
        .game-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .game-icon { font-size: 36px; margin-bottom: 8px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .skin-card { padding: 10px; text-align: center; position: relative; cursor: pointer; transition: all 0.2s; border: 1px solid var(--glass-border); }
        .skin-card:active { transform: scale(0.95); }
        .skin-icon { font-size: 32px; margin-bottom: 4px; }
        .skin-name { font-size: 11px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; height: 26px; overflow: hidden; }
        .skin-price { font-size: 12px; color: var(--accent-gold); font-weight: 700; }
        .rarity-common { border-color: var(--rarity-common); box-shadow: inset 0 0 10px rgba(148, 163, 184, 0.2); }
        .rarity-rare { border-color: var(--rarity-rare); box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.2); }
        .rarity-epic { border-color: var(--rarity-epic); box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.2); }
        .rarity-legendary { border-color: var(--rarity-legendary); box-shadow: inset 0 0 15px rgba(251, 191, 36, 0.3); }
        .rarity-mythic { border-color: var(--rarity-mythic); box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.4); animation: glow 2s infinite; }

        .stat-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--glass-border); }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 700; color: var(--accent-cyan); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; padding: 8px 12px; border-radius: 12px; transition: all 0.2s;
        }
        .nav-item.active { color: var(--accent-cyan); background: rgba(34, 211, 238, 0.1); }
        .nav-icon { font-size: 20px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200;
            display: none; align-items: flex-end; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; animation: slideUp 0.3s ease; }
        .modal-content {
            background: #12121f; width: 100%; max-height: 90vh; border-radius: 24px 24px 0 0;
            padding: 24px; overflow-y: auto; border-top: 1px solid var(--glass-border);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: 800; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .roulette-container {
            width: 100%; height: 120px; background: rgba(0,0,0,0.3); border-radius: 12px;
            position: relative; overflow: hidden; margin: 20px 0; border: 1px solid var(--glass-border);
        }
        .roulette-line {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--accent-gold);
            transform: translateX(-50%); z-index: 10; box-shadow: 0 0 10px var(--accent-gold);
        }
        .roulette-strip {
            display: flex; height: 100%; align-items: center; gap: 8px;
            position: absolute; left: 0; transform: translateX(0);
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .roulette-item {
            min-width: 100px; height: 100px; background: rgba(255,255,255,0.05); border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid transparent; flex-shrink: 0; text-align: center; font-size: 10px;
        }

        .bet-controls { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
        .bet-input {
            flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            color: white; padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 700; text-align: center;
        }
        .bet-btn { padding: 12px 16px; border-radius: 12px; background: rgba(255,255,255,0.1); border: none; color: white; font-weight: 700; cursor: pointer; }

        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
        .mine-cell {
            aspect-ratio: 1; background: rgba(255,255,255,0.1); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
        }
        .mine-cell.revealed { background: rgba(34, 197, 94, 0.2); border-color: var(--accent-green); }
        .mine-cell.bomb { background: rgba(239, 68, 68, 0.2); border-color: var(--accent-red); }

        .coin-container { perspective: 1000px; width: 120px; height: 120px; margin: 20px auto; }
        .coin {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 2s ease-out;
        }
        .coin-face {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 48px;
            backface-visibility: hidden; border: 4px solid var(--accent-gold);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }
        .coin-tails { transform: rotateY(180deg); background: linear-gradient(135deg, #94a3b8, #64748b); border-color: #cbd5e1; }

        .toast-container { position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast {
            background: rgba(20, 20, 35, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 10px;
            animation: slideUp 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .toast.success { border-left: 4px solid var(--accent-green); }
        .toast.error { border-left: 4px solid var(--accent-red); }

        .live-feed {
            position: fixed; bottom: calc(65px + env(safe-area-inset-bottom)); left: 0; right: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 8px 0;
            overflow: hidden; white-space: nowrap; border-top: 1px solid var(--glass-border); z-index: 90;
        }
        .feed-track { display: inline-flex; gap: 24px; animation: scroll 20s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .feed-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
        .feed-item .win { color: var(--accent-gold); font-weight: 700; }

        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="user-info">
            <div class="avatar" id="userAvatar">👤</div>
            <div>
                <div style="font-weight: 700; font-size: 14px;" id="userName">Игрок</div>
                <div style="font-size: 12px; color: var(--accent-cyan);">Ур. <span id="userLevel">1</span></div>
            </div>
        </div>
        <div class="balance-box">
            <div class="balance">💰 <span id="balanceDisplay">10000</span></div>
            <div class="claim-timer" id="claimTimer">Бонус доступен</div>
            <div class="progress-bar"><div class="progress-fill" id="claimProgress"></div></div>
        </div>
    </div>

    <div class="content" id="mainContent"></div>

    <div class="live-feed">
        <div class="feed-track" id="liveFeedTrack"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="app.navigate('home')">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="app.navigate('cases')">
            <span class="nav-icon">🎁</span>
            <span>Кейсы</span>
        </div>
        <div class="nav-item" onclick="app.navigate('games')">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </div>
        <div class="nav-item" onclick="app.navigate('inventory')">
            <span class="nav-icon">🎒</span>
            <span>Инвентарь</span>
        </div>
        <div class="nav-item" onclick="app.navigate('profile')">
            <span class="nav-icon">📊</span>
            <span>Профиль</span>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)app.closeModal()">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==========================================
        // ДАННЫЕ И КОНФИГУРАЦИЯ
        // ==========================================
        const SKINS = [
            {id:1, name:"Ржавый нож", rarity:"common", price:100, icon:"🔪"},
            {id:2, name:"Деревянный щит", rarity:"common", price:150, icon:"🛡️"},
            {id:3, name:"Простой шлем", rarity:"common", price:200, icon:"🪖"},
            {id:4, name:"Стальной клинок", rarity:"rare", price:500, icon:"⚔️"},
            {id:5, name:"Дробовик «Гром»", rarity:"rare", price:750, icon:"🔫"},
            {id:6, name:"Плазменный пистолет", rarity:"rare", price:1000, icon:"🔫"},
            {id:7, name:"Кибер-винтовка", rarity:"epic", price:2500, icon:"🎯"},
            {id:8, name:"Неоновый меч", rarity:"epic", price:4000, icon:"🗡️"},
            {id:9, name:"Золотой АК-47", rarity:"legendary", price:10000, icon:"🔱"},
            {id:10, name:"Драконий когтевой нож", rarity:"legendary", price:25000, icon:"🐉"},
            {id:11, name:"Корона Неонового Лорда", rarity:"mythic", price:100000, icon:"👑"}
        ];

        const CASES = [
            {id:'starter', name:'Новичок', price:250, icon:'📦', skins:[1,2,3,4]},
            {id:'advanced', name:'Оружейный', price:1000, icon:'💼', skins:[3,4,5,6,7]},
            {id:'elite', name:'Элитный', price:5000, icon:'🧰', skins:[6,7,8,9]},
            {id:'legend', name:'Легендарный', price:20000, icon:'👑', skins:[8,9,10,11]}
        ];

        // ==========================================
        // СОСТОЯНИЕ ПРИЛОЖЕНИЯ
        // ==========================================
        let state = {
            balance: 10000,
            xp: 0,
            level: 1,
            inventory: [],
            stats: { casesOpened: 0, gamesPlayed: 0, totalWon: 0 },
            lastClaimTime: 0
        };

        const CLAIM_INTERVAL = 90; // секунды

        // ==========================================
        // ПРИЛОЖЕНИЕ (ЯДРО)
        // ==========================================
        const app = {
            tg: window.Telegram?.WebApp,
            
            init() {
                if(this.tg) {
                    this.tg.ready();
                    this.tg.expand();
                    if(this.tg.initDataUnsafe?.user) {
                        document.getElementById('userName').innerText = this.tg.initDataUnsafe.user.first_name;
                    }
                }
                this.loadState();
                this.updateUI();
                this.startBonusTimer();
                this.initLiveFeed();
                this.navigate('home');
            },

            saveState() {
                localStorage.setItem('neon_casino_state', JSON.stringify(state));
            },

            loadState() {
                const saved = localStorage.getItem('neon_casino_state');
                if(saved) {
                    try {
                        state = { ...state, ...JSON.parse(saved) };
                    } catch(e) { console.error(e); }
                }
            },

            updateUI() {
                document.getElementById('balanceDisplay').innerText = state.balance.toLocaleString();
                document.getElementById('userLevel').innerText = state.level;
                this.saveState();
            },

            addXP(amount) {
                state.xp += amount;
                const nextLevel = Math.floor(state.xp / 500) + 1;
                if(nextLevel > state.level) {
                    state.level = nextLevel;
                    this.showToast(`Уровень повышен до ${state.level}! 🎉`, 'success');
                }
                this.updateUI();
            },

            showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerText = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            },

            navigate(tab) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const navIndex = ['home', 'cases', 'games', 'inventory', 'profile'].indexOf(tab);
                if(navIndex !== -1) document.querySelectorAll('.nav-item')[navIndex].classList.add('active');

                const content = document.getElementById('mainContent');
                content.innerHTML = '';

                switch(tab) {
                    case 'home': this.renderHome(content); break;
                    case 'cases': this.renderCases(content); break;
                    case 'games': this.renderGames(content); break;
                    case 'inventory': this.renderInventory(content); break;
                    case 'profile': this.renderProfile(content); break;
                }
            },

            openModal(html) {
                document.getElementById('modalContent').innerH
