</div>
            <div class="filters">
                <div class="filter-chip active" onclick="filterInventory('all', this)">Все</div>
                <div class="filter-chip" onclick="filterInventory('knife', this)">Ножи</div>
                <div class="filter-chip" onclick="filterInventory('rifle', this)">Винтовки</div>
                <div class="filter-chip" onclick="filterInventory('pistol', this)">Пистолеты</div>
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <!-- Заполняется через JS -->
            </div>
        </div>

        <!-- Вкладка: КЕЙСЫ -->
        <div id="tab-cases" class="tab-content">
            <div class="section-title">📦 Кейсы</div>
            <div class="cases-grid" id="casesGrid">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('games')" data-tab="games">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </div>
        <div class="nav-item" onclick="switchTab('cases')" data-tab="cases">
            <span class="nav-icon">📦</span>
            <span>Кейсы</span>
        </div>
        <div class="nav-item" onclick="switchTab('upgrader')" data-tab="upgrader">
            <span class="nav-icon">⬆️</span>
            <span>Апгрейд</span>
        </div>
        <div class="nav-item" onclick="switchTab('inventory')" data-tab="inventory">
            <span class="nav-icon">🎒</span>
            <span>Инвентарь</span>
        </div>
    </nav>

    <!-- МОДАЛЬНЫЕ ОКНА ИГР -->
    <!-- Mines -->
    <div id="modal-mines" class="modal-overlay" onclick="if(event.target === this) closeModal('modal-mines')">
        <div class="glass" style="padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center;">
            <h3 style="margin-bottom: 15px;">💣 Mines</h3>
            <div class="input-group">
                <label>Ставка</label>
                <input type="number" id="minesBet" class="styled-input" value="50" min="10">
            </div>
            <div class="input-group">
                <label>Кол-во мин (1-24)</label>
                <input type="number" id="minesCount" class="styled-input" value="3" min="1" max="24">
            </div>
            <button class="btn-primary glow-green" id="btnStartMines" onclick="startMines()">НАЧАТЬ ИГРУ</button>
            <button class="btn-primary" id="btnCashoutMines" onclick="cashoutMines()" style="background: var(--accent-gold); color: #000; margin-top: 10px; display: none;">ЗАБРАТЬ <span id="minesCurrentWin">0</span> 🪙</button>
            <div class="mines-grid" id="minesGrid"></div>
            <button class="btn-small" style="margin-top: 15px; background: rgba(255,255,255,0.1); color: white; width: 100%; padding: 10px;" onclick="closeModal('modal-mines')">Закрыть</button>
        </div>
    </div>

    <!-- Coinflip -->
    <div id="modal-coinflip" class="modal-overlay" onclick="if(event.target === this) closeModal('modal-coinflip')">
        <div class="glass" style="padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center;">
            <h3 style="margin-bottom: 15px;">🪙 Coinflip</h3>
            <div class="input-group">
                <label>Ставка</label>
                <input type="number" id="coinflipBet" class="styled-input" value="100" min="10">
            </div>
            <div style="font-size: 64px; margin: 20px 0; transition: transform 0.5s;" id="coinflipIcon">🪙</div>
            <button class="btn-primary glow-green" onclick="playCoinflip()">ПОДБРОСИТЬ (x2.0)</button>
            <button class="btn-small" style="margin-top: 15px; background: rgba(255,255,255,0.1); color: white; width: 100%; padding: 10px;" onclick="closeModal('modal-coinflip')">Закрыть</button>
        </div>
    </div>

    <!-- Slots -->
    <div id="modal-slots" class="modal-overlay" onclick="if(event.target === this) closeModal('modal-slots')">
        <div class="glass" style="padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center;">
            <h3 style="margin-bottom: 15px;">🎰 Slots</h3>
            <div class="input-group">
                <label>Ставка</label>
                <input type="number" id="slotsBet" class="styled-input" value="50" min="10">
            </div>
            <div style="display: flex; justify-content: center; gap: 10px; margin: 20px 0; font-size: 48px; background: var(--bg-dark); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border);" id="slotsDisplay">
                <span>🍒</span><span>🍒</span><span>🍒</span>
            </div>
            <button class="btn-primary glow-purple" onclick="playSlots()">КРУТИТЬ (x10 Джекпот)</button>
            <button class="btn-small" style="margin-top: 15px; background: rgba(255,255,255,0.1); color: white; width: 100%; padding: 10px;" onclick="closeModal('modal-slots')">Закрыть</button>
        </div>
    </div>

    <!-- Case Opening Modal -->
    <div id="modal-case" class="modal-overlay" onclick="if(event.target === this) closeModal('modal-case')">
        <div class="glass" style="padding: 20px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center;">
            <h3 style="margin-bottom: 15px;" id="caseOpenName">Кейс</h3>
            <div class="roulette-container">
                <div class="roulette-line"></div>
                <div class="roulette-strip" id="rouletteStrip"></div>
            </div>
            <button class="btn-primary glow-green" id="btnOpenCase" onclick="spinCase()">ОТКРЫТЬ ЗА <span id="caseOpenPrice">0</span> 🪙</button>
            <div id="caseWinDisplay" style="margin-top: 15px; font-weight: 800; font-size: 18px; color: var(--accent-gold); display: none;"></div>
            <button class="btn-small" style="margin-top: 15px; background: rgba(255,255,255,0.1); color: white; width: 100%; padding: 10px;" onclick="closeModal('modal-case')">Закрыть</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        // ==========================================
        // СОСТОЯНИЕ И ДАННЫЕ
        // ==========================================
        let balance = 1000;
        let inventory = [];
        let currentCase = null;
        let minesGame = { active: false, grid: [], bet: 0, minesCount: 3, revealed: 0, multiplier: 1.0 };
        
        const tg = window.Telegram.WebApp;
        
        const casesData = [
            { id: 1, name: "Бомж Кейс", price: 50, icon: "📦", items: [
                { name: "P250 | Песчаная буря", price: 10, rarity: "common", icon: "🔫", weight: 50, type: "pistol" },
                { name: "MP9 | Шторм", price: 25, rarity: "uncommon", icon: "🔫", weight: 30, type: "rifle" },
                { name: "AK-47 | Сафари", price: 150, rarity: "rare", icon: "🔫", weight: 15, type: "rifle" },
                { name: "AWP | Азимов", price: 500, rarity: "legendary", icon: "🔫", weight: 4, type: "rifle" },
                { name: "★ Нож | Бабочка", price: 5000, rarity: "ancient", icon: "🔪", weight: 1, type: "knife" }
            ]},
            { id: 2, name: "Премиум Кейс", price: 250, icon: "💼", items: [
                { name: "Glock-18 | Градиент", price: 100, rarity: "uncommon", icon: "🔫", weight: 40, type: "pistol" },
                { name: "M4A4 | Вой", price: 400, rarity: "mythical", icon: "🔫", weight: 30, type: "rifle" },
                { name: "AK-47 | Огненный змей", price: 1500, rarity: "immortal", icon: "🔫", weight: 20, type: "rifle" },
                { name: "★ Перчатки | Кровавая паутина", price: 8000, rarity: "ancient", icon: "🧤", weight: 10, type: "knife" }
            ]}
        ];

        const slotsSymbols = ["🍒", "🍋", "🍇", "💎", "7️⃣"];

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ
        // ==========================================
        function init() {
            if (tg) {
                tg.ready();
                tg.expand();
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    document.getElementById('userName').innerText = user.first_name || "User";
                    document.getElementById('userAvatar').innerText = (user.first_name || "U")[0].toUpperCase();
                }
            }
            
            // Рендер кейсов
            const casesGrid = document.getElementById('casesGrid');
            casesData.forEach(c => {
                const div = document.createElement('div');
                div.className = 'case-card';
                div.onclick = () => openCaseModal(c.id);
                div.innerHTML = `
                    <div class="case-img">${c.icon}</div>
                    <div class="case-name">${c.name}</div>
                    <div class="case-price">${c.price} 🪙</div>
                `;
                casesGrid.appendChild(div);
            });
            
            calcUpgradeChance();
            renderInventory();
            updateBalanceDisplay();
        }

        window.onload = init;

        // ==========================================
        // УТИЛИТЫ И НАВИГАЦИЯ
        // ==========================================
        function updateBalanceDisplay() {
            document.getElementById('balanceDisplay').innerText = balance;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const navItem = document.querySelector(`.nav-item[data-tab="${tabId}"]`);
            if (navItem) navItem.classList.add('active');
        }

        function addFunds() {
            balance += 1000;
            updateBalanceDisplay();
            showToast("Баланс пополнен на 1000 🪙!", "win");
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if (id === 'modal-mines' && minesGame.active) {
                resetMinesUI();
                minesGame.active = false;
            }
        }

        function openGame(game) {
            if (game === 'mines') document.getElementById('modal-mines').classList.add('active');
            else if (game === 'coinflip') document.getElementById('modal-coinflip').classList.add('active');
            else if (game === 'slots') document.getElementById('modal-slots').classList.add('active');
            else if (game === 'roulette') showToast("Режим в разработке", "lose");
        }

        // ==========================================
        // UPGRADER
        // ==========================================
        function calcUpgradeChance() {
            const target = parseFloat(document.getElementById('upgradeTarget').value) || 2;
            const chance = (1 / target) * 95;
            document.getElementById('upgradeChance').innerText = `Шанс: ${chance.toFixed(2)}%`;
        }

        function playUpgrade() {
            const bet = parseInt(document.getElementById('upgradeBet').value);
            const target = parseFloat(document.getElementById('upgradeTarget').value);
            
            if (bet > balance) return showToast("Недостаточно средств", "lose");
            
            balance -= bet;
            updateBalanceDisplay();
            
            const chance = (1 / target) * 95;
            const roll = Math.random() * 100;
            
            const btn = document.getElementById('btnUpgrade');
            btn.disabled = true;
            btn.innerText = "АПГРЕЙД...";
            
            setTimeout(() => {
                if (roll <= chance) {
                    const win = Math.floor(bet * target);
                    balance += win;
                    updateBalanceDisplay();
                    showToast(`Успех! +${win} 🪙`, "win");
                } else {
                    showToast("Неудача!", "lose");
                }
                btn.disabled = false;
                btn.innerText = "АПГРЕЙД";
            }, 1000);
        }

        // ==========================================
        // MINES
        // ==========================================
        function startMines() {
            const bet = parseInt(document.getElementById('minesBet').value);
            const minesCount = parseInt(document.getElementById('minesCount').value);
            if (bet > balance) return showToast("Недостаточно средств", "lose");
            
            balance -= bet;
            updateBalanceDisplay();
            
            minesGame = { active: true, grid: Array(25).fill('diamond'), bet: bet, minesCount: minesCount, revealed: 0, multiplier: 1.0 };
            
            let placed = 0;
            while(placed < minesCount) {
                let idx = Math.floor(Math.random() * 25);
                if (minesGame.grid[idx] === 'diamond') {
                    minesGame.grid[idx] = 'bomb';
                    placed++;
                }
            }
            
            document.getElementById('btnStartMines').style.display = 'none';
            document.getElementById('btnCashoutMines').style.display = 'block';
            renderMinesGrid();
        }

        function renderMinesGrid() {
            const gridEl = document.getElementById('minesGrid');
            gridEl.innerHTML = '';
            for(let i=0; i<25; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.dataset.index = i;
                cell.onclick = () => clickMine(i, cell);
                gridEl.appendChild(cell);
            }
        }

        function clickMine(index, cellEl) {
            if (!minesGame.active || cellEl.classList.contains('revealed')) return;
            
            if (minesGame.grid[index] === 'bomb') {
                cellEl.classList.add('bomb');
                cellEl.innerHTML = '💣';
                minesGame.active = false;
                showToast("Вы проиграли!", "lose");
                revealAllMines();
                resetMinesUI();
            } else {
                cellEl.classList.add('revealed');
                cellEl.innerHTML = '💎';
                minesGame.revealed++;
                minesGame.multiplier = 1 + (minesGame.revealed * minesGame.minesCount * 0.15);
                const currentWin = Math.floor(minesGame.bet * minesGame.multiplier);
                document.getElementById('minesCurrentWin').innerText = currentWin;
            }
        }

        function cashoutMines() {
            if (!minesGame.active) return;
            const win = Math.floor(minesGame.bet * minesGame.multiplier);
            balance += win;
            updateBalanceDisplay();
            showToast(`Вы забрали ${win} 🪙!`, "win");
            minesGame.active = false;
            revealAllMines();
            resetMinesUI();
        }

        function revealAllMines() {
            const cells = document.querySelectorAll('.mine-cell');
            cells.forEach((cell, i) => {
                if (minesGame.grid[i] === 'bomb') {
                    cell.classList.add('bomb');
                    cell.innerHTML = '💣';
                } else {
                    cell.classList.add('revealed');
                    cell.innerHTML = '💎';
                }
            });
        }

        function resetMinesUI() {
            document.getElementById('btnStartMines').style.display = 'block';
            document.getElementById('btnCashoutMines').style.display = 'none';
            document.getElementById('minesCurrentWin').innerText = '0';
        }

        // ==========================================
        // COINFLIP & SLOTS
        // ==========================================
        function playCoinflip() {
            const bet = parseInt(document.getElementById('coinflipBet').value);
            if (bet > balance) return showToast("Недостаточно средств", "lose");
            
            balance -= bet;
            updateBalanceDisplay();
            
            const coin = document.getElementById('coinflipIcon');
            coin.style.transform = "rotateY(720deg)";
            setTimeout(() => {
                coin.style.transform = "rotateY(0deg)";
                if (Math.random() > 0.5) {
                    const winAmount = bet * 2;
                    balance += winAmount;
                    updateBalanceDisplay();
                    showToast(`Победа! +${winAmount} 🪙`, "win");
                } else {
                    showToast("Проигрыш!", "lose");
                }
            }, 500);
        }

        function playSlots() {
            const bet = parseInt(document.getElementById('slotsBet').value);
            if (bet > balance) return showToast("Недостаточно средств", "lose");
            
            balance -= bet;
            updateBalanceDisplay();
            
            const display = document.getElementById('slotsDisplay');
            let spins = 0;
            const interval = setInterval(() => {
                display.innerHTML = `<span>${slotsSymbols[Math.floor(Math.random()*5)]}</span><span>${slotsSymbols[Math.floor(Math.random()*5)]}</span><span>${slotsSymbols[Math.floor(Math.random()*5)]}</span>`;
                spins++;
                if (spins > 10) {
                    clearInterval(interval);
                    finalizeSlots(bet);
                }
            }, 100);
        }

        function finalizeSlots(bet) {
            const r1 = slotsSymbols[Math.floor(Math.random()*5)];
            const r2 = slotsSymbols[Math.floor(Math.random()*5)];
            const r3 = slotsSymbols[Math.floor(Math.random()*5)];
            
            document.getElementById('slotsDisplay').innerHTML = `<span>${r1}</span><span>${r2}</span><span>${r3}</span>`;
            
            if (r1 === r2 && r2 === r3) {
                const multiplier = r1 === '7️⃣' ? 10 : 5;
                const win = bet * multiplier;
                balance += win;
                updateBalanceDisplay();
                showToast(`ДЖЕКПОТ! +${win} 🪙`, "win");
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                const win = Math.floor(bet * 1.5);
                balance += win;
                updateBalanceDisplay();
                showToast(`Пара! +${win} 🪙`, "win");
            } else {
                showToast("Проигрыш!", "lose");
            }
        }

        // ==========================================
        // КЕЙСЫ И РУЛЕТКА
        // ==========================================
        function openCaseModal(caseId) {
            currentCase = casesData.find(c => c.id === caseId);
            document.getElementById('caseOpenName').innerText = currentCase.name;
            document.getElementById('caseOpenPrice').innerText = currentCase.price;
            document.getElementById('caseWinDisplay').style.display = 'none';
            document.getElementById('btnOpenCase').disabled = false;
            
            const strip = document.getElementById('rouletteStrip');
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0px)';
            
            for(let i=0; i<50; i++) {
                const item = getRandomItem(currentCase.items);
                const div = document.createElement('div');
