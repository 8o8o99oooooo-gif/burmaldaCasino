<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurmaldinkaCasino</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00ffcc;
            --accent-pink: #ff007f;
            --text-color: #ffffff;
            --text-dim: #8a94a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 110px;
        }

        header {
            background: var(--card-bg);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--accent-color);
        }

        .balance-container {
            background: #0b0e14;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
            font-weight: bold;
            font-size: 1rem;
        }

        .balance-value {
            color: #00ffcc;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Кейсы */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid #232a36;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .case-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .case-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .case-price {
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        /* Рулетка */
        .roulette-container {
            width: 100%;
            height: 120px;
            background: #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            margin: 20px 0;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-pink);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .item-card {
            width: 100px;
            height: 100px;
            background: var(--card-bg);
            margin: 0 5px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid #333;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .inventory-item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 1px solid #232a36;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .inventory-item button {
            margin-top: 5px;
            padding: 6px;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .upgrader-container {
            background: var(--card-bg);
            padding: 20px;
