<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonDrop Casino</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00ffcc;
            --accent-pink: #ff007f;
            --text-color: #ffffff;
            --text-dim: #8a94a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 95px; /* Увеличенный отступ под большое меню */
        }

        header {
            background: var(--card-bg);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--accent-color);
        }

        .balance-container {
            background: #0b0e14;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
            font-weight: bold;
            font-size: 1rem;
        }

        .balance-value {
            color: #00ffcc;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Кейсы */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid #232a36;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .case-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .case-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .case-price {
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        /* Рулетка открытия кейса */
        .roulette-container {
            width: 100%;
            height: 120px;
            background: #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            margin: 20px 0;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-pink);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .item-card {
            width: 100px;
            height: 100px;
            background: var(--card-bg);
            margin: 0 5px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid #333;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .inventory-item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 1px solid #232a36;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .inventory-item button {
            margin-top: 5px;
            padding: 6px;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Круговой Апгрейдер */
        .upgrader-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px 0;
        }

        .circle-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: #232a36;
            stroke-width: 12;
        }

        .circle-progress {
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 12;
            stroke-dasharray: 502;
            stroke-dashoffset: 251;
            transition: stroke-dashoffset 0.3s ease;
        }

        .circle-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100px;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);
        }

        .circle-pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -4px;
            width: 12px;
            height: 12px;
            background: var(--accent-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        .circle-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .multiplier-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mult-btn {
            background: #232a36;
            color: #fff;
            border: 1px solid transparent;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .mult-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Мини-игры */
        .game-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #232a36;
        }

        .game-card h3 {
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .mine-cell {
            aspect-ratio: 1;
            background: #0b0e14;
            border: 1px solid #232a36;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .mine-cell.open-gem { background: rgba(0, 255, 204, 0.2); border-color: var(--accent-color); }
        .mine-cell.open-bomb { background: rgba(255, 0, 127, 0.2); border-color: var(--accent-pink); }

        .tower-grid {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            margin: 15px 0;
        }

        .tower-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .tower-cell {
            padding: 12px;
            background: #0b0e14;
            border: 1px solid #232a36;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        .tower-cell.active-row { border-color: var(--accent-color); background: #192231; }
        .tower-cell.win { background: rgba(0, 255, 204, 0.3); border-color: var(--accent-color); }
        .tower-cell.lose { background: rgba(255, 0, 127, 0.3); border-color: var(--accent-pink); }

        .wheel-box {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 15px auto;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            background: radial-gradient(circle, #151a23 0%, #0b0e14 100%);
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }

        .game-input {
            width: 100%;
            padding: 10px;
            background: #0b0e14;
            border: 1px solid #232a36;
            color: #fff;
            border-radius: 6px;
            margin: 8px 0;
            font-size: 0.95rem;
        }

        /* Общие кнопки */
        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* УВЕЛИЧЕННОЕ НИЖНЕЕ МЕНЮ */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111620;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-top: 2px solid #232a36;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
            overflow-x: auto;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 8px;
            border-radius: 10px;
            flex: 1;
            min-width: 68px;
            transition: all 0.2s ease;
        }

        .nav-btn .nav-icon {
            font-size: 1.4rem;
        }

        .nav-btn.active {
            color: var(--accent-color);
            background: rgba(0, 255, 204, 0.08);
            border-color: rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
        }

        /* Редкость */
        .common { border-color: #b0c3d9; }
        .rare { border-color: #4b69ff; }
        .classified { border-color: #d32ce6; }
        .covert { border-color: #eb4b4b; }
    </style>
</head>
<body>

    <header>
        <div class="logo">NEONDROP</div>
        <div class="balance-container">
            Баланс: <span id="balance" class="balance-value">1000</span> $
        </div>
    </header>

    <div class="container">
        <!-- Вкладка: Кейсы -->
        <section id="cases-tab" class="tab-content active">
            <h2>Кейсы CS2</h2>
            <div id="cases-list" class="cases-grid"></div>

            <div id="roulette-section" style="display: none;">
                <h3 id="current-case-title" style="text-align: center; margin-top: 20px;"></h3>
                <div class="roulette-container">
                    <div class="roulette-pointer"></div>
                    <div id="roulette-track" class="roulette-track"></div>
                </div>
                <button id="open-btn" class="btn" onclick="spinCase()">Открыть кейс</button>
                <button class="btn" style="background: #333; color: #fff; margin-top: 8px;" onclick="closeCase()">Назад</button>
            </div>
        </section>

        <!-- Вкладка: Апгрейдер -->
        <section id="upgrader-tab" class="tab-content">
            <h2>Upgrader</h2>
            <div class="upgrader-container">
                <div id="upgrade-item-info">Выберите предмет из инвентаря</div>
                
                <div class="circle-wrapper">
                    <svg class="circle-svg" viewBox="0 0 180 180">
                        <circle class="circle-bg" cx="90" cy="90" r="80"></circle>
                        <circle id="upgrade-circle" class="circle-progress" cx="90" cy="90" r="80"></circle>
                    </svg>
                    <div id="upgrade-pointer" class="circle-pointer"></div>
                    <div id="upgrade-chance-text" class="circle-info">50%</div>
                </div>

                <div class="multiplier-selector">
                    <button class="mult-btn active" onclick="setMultiplier(1.5, this)">x1.5</button>
                    <button class="mult-btn" onclick="setMultiplier(2, this)">x2.0</button>
                    <button class="mult-btn" onclick="setMultiplier(5, this)">x5.0</button>
                    <button class="mult-btn" onclick="setMultiplier(10, this)">x10.0</button>
                </div>

                <div style="margin-bottom: 10px;">Желаемый выигрыш: <span id="target-value" style="color: var(--accent-color);">0$</span></div>

                <button id="upgrade-start-btn" class="btn" onclick="startUpgrade()">Апгрейд</button>
            </div>
        </section>

        <!-- Вкладка: Игры -->
        <section id="games-tab" class="tab-content">
            <h2>Мини-игры</h2>
            
            <!-- Mines -->
            <div class="game-card">
                <h3>💣 Mines (Минёр)</h3>
                <input type="number" id="mines-bet" class="game-input" placeholder="Ставка ($)" value="50">
                <label style="font-size: 0.9rem;">Количество мин:</label>
                <select id="mines-count" class="game-input">
                    <option value="3">3 мины</option>
                    <option value="5">5 мин</option>
                    <option value="10">10 мин</option>
                </select>
                <button id="mines-start-btn" class="btn" onclick="startMines()">Начать игру</button>
                <button id="mines-cashout-btn" class="btn" style="background: #00ffcc; display:none;" onclick="cashoutMines()">Забрать (<span id="mines-win-amount">0</span>$)</button>
                <div id="mines-grid" class="mines-grid"></div>
            </div>

            <!-- Tower -->
            <div class="game-card">
                <h3>🗼 Tower (Башня)</h3>
                <input type="number" id="tower-bet" class="game-input" placeholder="Ставка ($)" value="50">
                <button id="tower-start-btn" class="btn" onclick="startTower()">Старт Башни</button>
                <button id="tower-cashout-btn" class="btn" style="background: #00ffcc; display:none; margin-top: 8px;" onclick="cashoutTower()">Забрать (<span id="tower-win-amount">0</span>$)</button>
                <div id="tower-grid" class="tower-grid"></div>
            </div>

            <!-- Coinflip -->
            <div class="game-card">
                <h3>🪙 Coinflip (Монетка)</h3>
                <input type="number" id="coinflip-bet" class="game-input" placeholder="Ставка ($)" value="50">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button class="btn" style="background: #232a36; color:#fff;" onclick="playCoinflip('heads')">Орел</button>
                    <button class="btn" style="background: #232a36; color:#fff;" onclick="playCoinflip('tails')">Решка</button>
                </div>
                <div id="coinflip-result" style="text-align: center; font-weight: bold;"></div>
            </div>

            <!-- Wheel of Fortune -->
            <div class="game-card">
                <h3>🎯 Wheel (Колесо Фортуны)</h3>
                <input type="number" id="wheel-bet" class="game-input" placeholder="Ставка ($)" value="50">
                <div id="wheel-display" class="wheel-box">?</div>
                <button id="wheel-spin-btn" class="btn" onclick="spinWheel()">Крутить колесо</button>
            </div>
        </section>

        <!-- Вкладка: Инвентарь -->
        <section id="inventory-tab" class="tab-content">
            <h2>Ваш Инвентарь</h2>
            <div id="inventory-list" class="inventory-grid"></div>
        </section>

        <!-- Вкладка: Профиль -->
        <section id="profile-tab" class="tab-content">
            <h2>Профиль</h2>
            <div class="upgrader-container" style="text-align: left; align-items: flex-start; margin-top: 15px;">
                <p>Время в игре: <span id="time-played" style="color: var(--accent-color);">0</span> сек.</p>
                <p style="margin-top: 10px;">Всего открыто кейсов: <span id="cases-opened" style="color: var(--accent-color);">0</span></p>
                <button class="btn" style="margin-top: 20px; background: var(--accent-pink); color: #fff;" onclick="addBonus()">Получить бонус (+100$)</button>
            </div>
        </section>
    </div>

    <!-- Увеличенное удобное меню -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('cases-tab', this)">
            <span class="nav-icon">📦</span>
            <span>Кейсы</span>
        </button>
        <button class="nav-btn" onclick="switchTab('upgrader-tab', this)">
            <span class="nav-icon">⚡</span>
            <span>Апгрейд</span>
        </button>
        <button class="nav-btn" onclick="switchTab('games-tab', this)">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </button>
        <button class="nav-btn" onclick="switchTab('inventory-tab', this)">
            <span class="nav-icon">🎒</span>
            <span>Инвентарь</span>
        </button>
        <button class="nav-btn" onclick="switchTab('profile-tab', this)">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </nav>

    <script>
        const CASES = [
            {
                id: 'revolution',
                title: 'Revolution Case',
                price: 150,
                items: [
                    { name: 'AK-47 | Head Shot', price: 800, rarity: 'covert' },
                    { name: 'M4A1-S | Emophoria', price: 300, rarity: 'classified' },
                    { name: 'AWP | Duality', price: 100, rarity: 'rare' },
                    { name: 'P90 | Neoqueen', price: 30, rarity: 'common' }
                ]
            },
            {
                id: 'dreams',
                title: 'Dreams & Nightmares',
                price: 200,
                items: [
                    { name: 'AK-47 | Nightwish', price: 1000, rarity: 'covert' },
                    { name: 'MP9 | Starlight', price: 250, rarity: 'classified' },
                    { name: 'Dual Berettas | Melondrama', price: 80, rarity: 'rare' },
                    { name: 'FAMAS | Rapid Eye', price: 40, rarity: 'common' }
