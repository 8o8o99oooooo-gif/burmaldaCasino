<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0c">
    <title>Lucky Case — CS2 (Premium)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #13131a;
            --card-border: #2a2a35;
            --accent-red: #dc2626;
            --accent-red-dark: #991b1b;
            --accent-red-glow: rgba(220, 38, 38, 0.4);
            --accent-gold: #fbbf24;
            --accent-gold-glow: rgba(251, 191, 36, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(220,38,38,0.08), transparent);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: 56px;
            padding-bottom: calc(96px + env(safe-area-inset-bottom));
            position: relative; overflow-x: hidden;
        }

        .bg-circles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .circle { position: absolute; border-radius: 50%; filter: blur(40px); }
        .c1 { width: 300px; height: 300px; top: -100px; left: -100px; background: rgba(220,38,38,0.08); }
        .c2 { width: 250px; height: 250px; top: 40%; right: -80px; background: rgba(251,191,36,0.05); }

        header, .container, .modal, nav.bottom-nav { position: relative; z-index: 10; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(12px); position: fixed; top: 0; left: 0; width: 100%;
            border-bottom: 1px solid rgba(220, 38, 38, 0.2); z-index: 150;
        }
        .logo { font-weight: 900; font-size: 1.1rem; letter-spacing: 0.5px; }
        .logo b { color: var(--accent-red); }

        .user-link {
            font-size: 0.8rem; font-weight: 700; color: var(--accent-red);
            text-decoration: none; background: rgba(220, 38, 38, 0.1);
            padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(220, 38, 38, 0.3);
        }

        .dashboard-panel {
            background: linear-gradient(135deg, rgba(30, 20, 20, 0.9), rgba(19, 19, 26, 0.95));
            border: 1px solid rgba(220, 38, 38, 0.25);
            border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .header-stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .stat-badge {
            display: flex; align-items: center; gap: 6px;
            background: rgba(220, 38, 38, 0.1); padding: 6px 12px; border-radius: 20px;
            border: 1px solid rgba(220, 38, 38, 0.2); font-size: 0.85rem; font-weight: 700;
        }
        .stat-badge span:first-child { color: var(--accent-red); }
        #user-balance.pulse { animation: balPulse 0.45s ease; }
        @keyframes balPulse { 0% { transform: scale(1); } 40% { transform: scale(1.15); color: var(--accent-gold); } 100% { transform: scale(1); } }

        .disclaimer {
            font-size: 0.65rem; color: var(--text-muted); text-align: center;
            margin: 8px 0 16px; opacity: 0.7;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 14px 16px; display: none; }
        .container.active-tab { display: block; }

        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 12, 0.98); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(220, 38, 38, 0.15);
            display: flex; justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 100;
        }
        .nav-item {
            background: none; border: none; color: var(--text-muted);
            font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column;
            align-items: center; gap: 4px; cursor: pointer; transition: color 0.2s;
        }
        .nav-item span { font-size: 1.3rem; }
        .nav-item.active { color: var(--accent-red); }

        .promo-banner {
            background: linear-gradient(135deg, var(--accent-red-dark), var(--accent-red));
            border-radius: var(--radius); padding: 16px; text-align: center;
            margin-bottom: 16px; color: white; box-shadow: 0 10px 25px rgba(220, 38, 38, 0.25);
            text-decoration: none; display: block; border: 1px solid rgba(255,255,255,0.1);
        }
        .promo-banner h2 { font-size: 1.1rem; margin-bottom: 4px; }
        .promo-banner p { font-size: 0.8rem; opacity: 0.9; }

        .section-title {
            font-size: 1.05rem; font-weight: 800; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; color: var(--text-main);
        }
        .section-title span:last-child { font-size: 0.75rem; color: var(--accent-red); font-weight: 600; background: rgba(220,38,38,0.1); padding: 4px 8px; border-radius: 8px; }

        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .case-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 12px;
            text-align: center; border: 1px solid var(--card-border); cursor: pointer;
            transition: transform 0.15s, border-color 0.2s; position: relative; overflow: hidden;
        }
        .case-card:active { transform: scale(0.96); }
        .case-card.cooldown { opacity: 0.5; pointer-events: none; }
        .case-card:hover { border-color: var(--accent-red); }
        .case-img-box { height: 90px; display: flex; align-items: center; justify-content: center; margin: 4px 0; }
        .case-img-box img { max-height: 85px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6)); }
        .case-name { font-size: 0.82rem; font-weight: 800; margin-bottom: 6px; min-height: 36px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        .case-price { font-size: 0.9rem; color: var(--accent-gold); font-weight: 800; }

        .cd-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(10,10,12,0.9);
            font-size: 0.75rem; color: var(--accent-red); padding: 6px; font-weight: bold; text-align: center; z-index: 5;
        }

        .modal {
            display: none; position: fixed; inset: 0;
            background: var(--bg-color); z-index: 200; overflow-y: auto; padding: 16px; flex-direction: column;
        }
        .modal.active { display: flex; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .back-btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-main); padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer;
        }
        .back-btn.disabled { opacity: 0.4; pointer-events: none; }

        .game-arena {
            background: var(--card-bg); border-radius: var(--radius); padding: 16px;
            text-align: center; flex-grow: 1; display: flex; flex-direction: column;
            justify-content: space-between; border: 1px solid var(--card-border);
            max-width: 440px; margin: 0 auto; width: 100%;
        }

        .case-count-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .count-btn {
            background: #1e1e28; border: 1px solid var(--card-border); color: var(--text-muted);
            padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
        }
        .count-btn.active { background: var(--accent-red); color: white; border-color: var(--accent-red); }
        .count-btn.disabled { opacity: 0.4; pointer-events: none; }

        .case-opening-container {
            position: relative; width: 100%; height: 150px; background: #050507;
            border-radius: 12px; overflow: hidden; border: 2px solid var(--card-border);
            margin: 14px 0; display: flex; align-items: center;
        }
        .case-opening-container::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(90deg, #050507 0%, transparent 20%, transparent 80%, #050507 100%);
        }
        .case-opening-pointer {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 3px;
            background: var(--accent-gold); transform: translateX(-50%); z-index: 20;
            box-shadow: 0 0 15px var(--accent-gold);
        }
        .case-roller { display: flex; gap: 10px; position: absolute; left: 0; will-change: transform; }
        .skin-ticket {
            min-width: 120px; height: 120px; background: #1a1a24; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 8px; border-bottom: 4px solid #fff; text-align: center;
        }
        .skin-ticket.win { box-shadow: 0 0 25px var(--accent-gold-glow), inset 0 0 15px rgba(251,191,36,0.15); border: 1px solid var(--accent-gold); }
        .skin-ticket .s-img { width: 90px; height: 65px; object-fit: contain; margin-bottom: 4px; }
        .skin-ticket .s-name { font-size: 0.65rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--text-muted); }

        .display-screen {
            background: #0f0f14; border-radius: 12px; padding: 14px;
            min-height: 80px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin: 8px 0;
            border: 1px solid var(--card-border); color: var(--text-main); gap: 6px;
        }

        .inventory-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            max-height: calc(100vh - 250px); overflow-y: auto; padding-right: 4px;
        }
        .inventory-grid::-webkit-scrollbar { width: 4px; }
        .inventory-grid::-webkit-scrollbar-thumb { background: var(--accent-red); border-radius: 4px; }
        .inventory-item {
            background: var(--card-bg); border-radius: 12px; padding: 10px; display: flex;
            flex-direction: column; align-items: center; position: relative;
            border: 1px solid var(--card-border);
        }
        .rarity-chip {
            font-size: 0.55rem; font-weight: 800; padding: 2px 6px; border-radius: 6px;
            color: #000; margin-bottom: 4px; letter-spacing: 0.3px; text-transform: uppercase;
        }
        .inv-skin-img { width: 100%; height: 65px; object-fit: contain; margin: 4px 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .inv-skin-weapon { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
        .inv-skin-name { font-size: 0.8rem; font-weight: 800; text-align: center; margin-bottom: 4px; color: var(--text-main); }
        .inv-skin-price { font-size: 0.85rem; color: var(--accent-gold); font-weight: 800; margin-bottom: 8px; }
        .inv-sell-btn {
            background: linear-gradient(135deg, var(--accent-red-dark), var(--accent-red)); color: white; border: none; padding: 8px 12px;
            border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; width: 100%;
        }
        .inv-sell-btn:active { opacity: 0.8; }
        .empty-inv { grid-column: span 2; text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px dashed var(--card-border); }

        .btn {
            background: linear-gradient(135deg, var(--accent-red-dark), var(--accent-red));
            color: white; border: none; padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%;
            box-shadow: 0 4px 14px var(--accent-red-glow); transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn.disabled { opacity: 0.4; pointer-events: none; }
        .btn-gold { background: linear-gradient(135deg, #b45309, var(--accent-gold)); color: #000; box-shadow: 0 4px 14px var(--accent-gold-glow); }

        /* --- АПГРЕЙДЕР --- */
        .upgrader-container { display: flex; flex-direction: column; gap: 16px; }
        .upgrader-box-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .upgrade-card-slot {
            flex: 1; background: #0f0f14; border: 2px dashed var(--card-border); border-radius: 14px;
            padding: 12px 8px; min-height: 140px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; text-align: center; gap: 4px;
            transition: all 0.2s;
        }
        .upgrade-card-slot.selected { border-style: solid; border-color: var(--accent-gold); background: rgba(251,191,36,0.05); }
        .upgrade-card-slot img { width: 100%; max-width: 100px; height: 60px; object-fit: contain; }
        
        .upgrader-circle-container {
            position: relative; width: 120px; height: 120px; margin: 0 auto;
        }
        .progress-ring__circle-bg { stroke: #2a2a35; stroke-width: 6; fill: transparent; }
        .progress-ring__circle { 
            stroke: var(--accent-gold); stroke-width: 6; fill: transparent; 
            stroke-dasharray: 326.72; stroke-dashoffset: 326.72; 
            transition: stroke-dashoffset 0.6s ease; transform: rotate(-90deg); transform-origin: 50% 50%;
        }
        .progress-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.4rem; font-weight: 900; color: var(--accent-gold);
        }

        .selector-modal-list { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; 
            max-height: 420px; overflow-y: auto; padding-right: 4px; 
            background: var(--bg-color); /* Убираем серое место */
        }

        .bet-control {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f0f14; padding: 10px 14px; border-radius: 12px; margin: 10px 0;
            border: 1px solid var(--card-border); font-weight: 700; font-size: 0.9rem;
        }
        .bet-control input {
            background: transparent; border: none; color: var(--accent-gold);
            font-size: 1.15rem; font-weight: 800; width: 110px; text-align: center; outline: none;
        }

        .slot-machine-cabinet {
            background: linear-gradient(145deg, #1e1e28, #0f0f14);
            border: 3px solid var(--card-border); border-radius: 16px; padding: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6); margin-bottom: 8px;
        }
        .slots-window { display: flex; justify-content: center; gap: 10px; background: #050507; padding: 12px; border-radius: 10px; border: 2px solid var(--card-border); }
        .slot-reel-box {
            background: #1a1a24; color: var(--text-main); font-size: 2rem; width: 65px; height: 75px;
            display: flex; align-items: center; justify-content: center; border-radius: 8px;
            overflow: hidden; box-shadow: inset 0 0 8px rgba(0,0,0,0.4); border: 1px solid var(--card-border);
        }

        .aviator-box {
            position: relative; width: 100%; height: 180px; background: #050507;
            border-radius: 12px; overflow: hidden; border: 1px solid var(--card-border); margin-bottom: 8px;
        }
        #aviator-canvas { width: 100%; height: 100%; display: block; }
        .aviator-mult-display {
            position: absolute; top: 10px; right: 14px; font-size: 1.9rem; font-weight: 900; color: var(--accent-red);
            text-shadow: 0 2px 12px var(--accent-red-glow); z-index: 2;
        }

        .mines-grid-25 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
        .mine-cell-25 {
            background: #1e1e28; aspect-ratio: 1; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1.15rem; cursor: pointer;
            transition: transform 0.1s, background 0.2s; border: 1px solid var(--card-border);
        }
        .mine-cell-25:active { transform: scale(0.9); }
        .mine-cell-25.open { background: #064e3b; border-color: #10b981; }

        #toast {
            position: fixed; bottom: 190px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: #1e1e28; color: white; border: 1px solid var(--accent-red);
            padding: 12px 24px; border-radius: 20px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
            font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.6); pointer-events: none;
            max-width: 90%; text-align: center; font-size: 0.9rem;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
