<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .balance {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        
        .games {
            display: grid;
            gap: 15px;
        }
        
        .game-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            padding: 20px;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .game-btn:hover {
            transform: translateY(-2px);
        }
        
        .game-btn:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            display: none;
        }
        
        .result.win {
            background: rgba(76, 175, 80, 0.3);
            display: block;
        }
        
        .result.lose {
            background: rgba(244, 67, 54, 0.3);
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Telegram Casino</h1>
        
        <div class="balance">
            💰 <span id="balance">1000</span> 🪙
        </div>
        
        <div class="games">
            <button class="game-btn" onclick="playCoinflip()">
                🪙 Орёл или Решка (x2)
            </button>
            <button class="game-btn" onclick="playSlots()">
                🎰 Слоты (до x10)
            </button>
            <button class="game-btn" onclick="playRoulette()">
                🔴⚫ Рулетка (x2)
            </button>
        </div>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Получаем данные пользователя (если отправил бот)
        const user = tg.initDataUnsafe.user;
        let balance = 1000; // В реальности получать от бота через API
        
        function updateBalance() {
            document.getElementById('balance').textContent = balance;
        }
        
        function showResult(text, isWin) {
            const result = document.getElementById('result');
            result.textContent = text;
            result.className = 'result ' + (isWin ? 'win' : 'lose');
            setTimeout(() => {
                result.className = 'result';
            }, 3000);
        }
        
        function playCoinflip() {
            const bet = 50;
            if (balance < bet) {
                showResult('❌ Недостаточно монет!', false);
                return;
            }
            
            balance -= bet;
            const result = Math.random() < 0.5 ? 'орёл' : 'решка';
            const choice = Math.random() < 0.5 ? 'орёл' : 'решка';
            
            if (result === choice) {
                const win = bet * 2;
                balance += win;
                showResult(🎉 Выпало: ${result}\nТы выиграл +${win} 🪙!, true);
            } else {
                showResult(😢 Выпало: ${result}\nТы проиграл ${bet} 🪙, false);
            }
            updateBalance();
        }
        
        function playSlots() {
            const bet = 100;
            if (balance < bet) {
                showResult('❌ Недостаточно монет!', false);
                return;
            }
            
            balance -= bet;
            const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
            const reels = [
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)]
            ];
            
            let win = 0;
            if (reels[0] === reels[1] && reels[1] === reels[2]) {
                win = bet * 5;
                showResult(🎰 ${reels.join(' | ')}\nДЖЕКПОТ! +${win} 🪙, true);
            } else if (reels[0] === reels[1] || reels[1] === reels[2]) {
                win = bet;
                showResult(🎰 ${reels.join(' | ')}\nДва совпадения! Возврат ${win} 🪙, true);
            } else {
                showResult(🎰 ${reels.join(' | ')}\nНет совпадений 😢, false);
            }
            
            balance += win;
            updateBalance();
        }
        
        function playRoulette() {
            const bet = 75;
            if (balance < bet) {
                showResult('❌ Недостаточно монет!', false);
                return;
            }
            
            balance -= bet;
            const result = Math.random() < 0.5 ? 'red' : 'black';
            const choice = Math.random() < 0.5 ? 'red' : 'black';
            
            const colorEmoji = {red: '🔴', black: '⚫'};
            const colorName = {red: 'Красное', black: 'Чёрное'};
            
            if (result === choice) {
                const win = bet * 2;
                balance += win;
                showResult(🎲 Выпало ${colorEmoji[result]} ${colorName[result]}\nТы выиграл +${win} 🪙!, true);
            } else {
                showResult(🎲 Выпало ${colorEmoji[result]} ${colorName[result]}\nТы проиграл ${bet} 🪙, false);
            }
            updateBalance();
        }
        
        // Отправка данных боту (опционально)
        function sendToBot(data) {
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
