<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonDrop Casino</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00ffcc;
            --accent-pink: #ff007f;
            --text-color: #ffffff;
            --text-dim: #8a94a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        header {
            background: var(--card-bg);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--accent-color);
        }

        .balance-container {
            background: #0b0e14;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
            font-weight: bold;
        }

        .balance-value {
            color: #00ffcc;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Кейсы */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid #232a36;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .case-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .case-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .case-price {
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        /* Модалка открытия кейса */
        .roulette-container {
            width: 100%;
            height: 120px;
            background: #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            margin: 20px 0;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-pink);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .item-card {
            width: 100px;
            height: 100px;
            background: var(--card-bg);
            margin: 0 5px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid #333;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .inventory-item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 1px solid #232a36;
            font-size: 0.8rem;
        }

        .inventory-item button {
            margin-top: 8px;
            width: 100%;
            padding: 4px;
            background: var(--accent-pink);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Апгрейдер */
        .upgrader-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        /* Кнопки */
        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Нижнее меню */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #232a36;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-btn.active {
            color: var(--accent-color);
        }

        /* Редкость */
        .common { border-color: #b0c3d9; }
        .rare { border-color: #4b69ff; }
        .classified { border-color: #d32ce6; }
        .covert { border-color: #eb4b4b; }
    </style>
</head>
<body>

    <header>
        <div class="logo">NEONDROP</div>
        <div class="balance-container">
            Баланс: <span id="balance" class="balance-value">1000</span> $
        </div>
    </header>

    <div class="container">
        <!-- Вкладка: Кейсы -->
        <section id="cases-tab" class="tab-content active">
            <h2>Кейсы CS2</h2>
            <div id="cases-list" class="cases-grid"></div>

            <div id="roulette-section" style="display: none;">
                <h3 id="current-case-title" style="text-align: center; margin-top: 20px;"></h3>
                <div class="roulette-container">
                    <div class="roulette-pointer"></div>
                    <div id="roulette-track" class="roulette-track"></div>
                </div>
                <button id="open-btn" class="btn" onclick="spinCase()">Открыть кейс</button>
                <button class="btn" style="background: #333; color: #fff;" onclick="closeCase()">Назад</button>
            </div>
        </section>

        <!-- Вкладка: Инвентарь -->
        <section id="inventory-tab" class="tab-content">
            <h2>Ваш Инвентарь</h2>
            <div id="inventory-list" class="inventory-grid"></div>
        </section>

        <!-- Вкладка: Апгрейдер -->
        <section id="upgrader-tab" class="tab-content">
            <h2>Upgrader</h2>
            <div class="upgrader-box">
                <p>Выберите предмет из инвентаря для улучшения</p>
                <div id="upgrade-selected" style="margin: 15px 0; font-weight: bold;">Предмет не выбран</div>
                <button class="btn" onclick="tryUpgrade()">Улучшить (Шанс 50%)</button>
            </div>
        </section>

        <!-- Вкладка: Профиль -->
        <section id="profile-tab" class="tab-content">
            <h2>Профиль</h2>
            <div class="upgrader-box" style="text-align: left; margin-top: 15px;">
                <p>Время в игре: <span id="time-played" style="color: var(--accent-color);">0</span> сек.</p>
                <p style="margin-top: 10px;">Всего открыто кейсов: <span id="cases-opened" style="color: var(--accent-color);">0</span></p>
                <button class="btn" style="margin-top: 20px; background: var(--accent-pink); color: #fff;" onclick="addBonus()">Получить бонус (+100$)</button>
            </div>
        </section>
    </div>

    <!-- Нижняя навигация -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('cases-tab', this)">📦 Кейсы</button>
        <button class="nav-btn" onclick="switchTab('inventory-tab', this)">🎒 Инвентарь</button>
        <button class="nav-btn" onclick="switchTab('upgrader-tab', this)">⚡ Апгрейд</button>
        <button class="nav-btn" onclick="switchTab('profile-tab', this)">👤 Профиль</button>
    </nav>

    <script>
        // База данных кейсов и скинов
        const CASES = [
            {
                id: 'revolution',
                title: 'Revolution Case',
                price: 150,
                items: [
                    { name: 'AK-47 | Head Shot', price: 800, rarity: 'covert' },
                    { name: 'M4A1-S | Emophoria', price: 300, rarity: 'classified' },
                    { name: 'AWP | Duality', price: 100, rarity: 'rare' },
                    { name: 'P90 | Neoqueen', price: 30, rarity: 'common' }
                ]
            },
            {
                id: 'dreams',
                title: 'Dreams & Nightmares',
                price: 200,
                items: [
                    { name: 'AK-47 | Nightwish', price: 1000, rarity: 'covert' },
                    { name: 'MP9 | Starlight', price: 250, rarity: 'classified' },
                    { name: 'Dual Berettas | Melondrama', price: 80, rarity: 'rare' },
                    { name: 'FAMAS | Rapid Eye', price: 40, rarity: 'common' }
                ]
            }
        ];

        // Состояние приложения
        let state = {
            balance: 1000,
            inventory: [],
            casesOpened: 0,
            timePlayed: 0,
            selectedCase: null,
            selectedUpgraderItem: null
        };

        // Загрузка состояния из localStorage
        function loadState() {
            const saved = localStorage.getItem('neon_drop_state');
            if (saved) {
                try {
                    state = { ...state, ...JSON.parse(saved) };
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        // Сохранение состояния
        function saveState() {
            localStorage.setItem('neon_drop_state', JSON.stringify({
                balance: state.balance,
                inventory: state.inventory,
                casesOpened: state.casesOpened,
                timePlayed: state.timePlayed
            }));
            updateUI();
        }

        // Обновление UI
        function updateUI() {
            document.getElementById('balance').innerText = state.balance;
            document.getElementById('cases-opened').innerText = state.casesOpened;
            document.getElementById('time-played').innerText = state.timePlayed;
            renderInventory();
        }

        // Переключение вкладок
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        // Отрисовка списка кейсов
        function renderCases() {
            const container = document.getElementById('cases-list');
            container.innerHTML = '';
            CASES.forEach(c => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.innerHTML = `
                    <div class="case-title">${c.title}</div>
                    <div class="case-price">${c.price} $</div>
                `;
                card.onclick = () => selectCase(c);
                container.appendChild(card);
            });
        }

        // Выбор кейса
        function selectCase(c) {
            state.selectedCase = c;
            document.getElementById('cases-list').style.display = 'none';
            document.getElementById('roulette-section').style.display = 'block';
            document.getElementById('current-case-title').innerText = c.title;
            resetRoulette();
        }

        // Закрытие кейса
        function closeCase() {
            document.getElementById('cases-list').style.display = 'grid';
            document.getElementById('roulette-section').style.display = 'none';
        }

        function resetRoulette() {
            const track = document.getElementById('roulette-track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            track.innerHTML = '';
        }

        // Вращение рулетки
        function spinCase() {
            const c = state.selectedCase;
            if (!c || state.balance < c.price) {
                alert('Недостаточно средств!');
                return;
            }

            state.balance -= c.price;
            state.casesOpened++;
            saveState();

            const btn = document.getElementById('open-btn');
            btn.disabled = true;

            const track = document.getElementById('roulette-track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            
            // Генерируем ленту предметов
            let itemsSequence = [];
            for (let i = 0; i < 50; i++) {
                const randomItem = c.items[Math.floor(Math.random() * c.items.length)];
                itemsSequence.push(randomItem);
            }

            const winItem = c.items[Math.floor(Math.random() * c.items.length)];
            itemsSequence[40] = winItem; // Выигрышный предмет

            track.innerHTML = itemsSequence.map(item => `
                <div class="item-card ${item.rarity}">
                    <div>${item.name}</div>
                    <div style="color: var(--accent-color);">${item.price}$</div>
                </div>
            `).join('');

            // Анимация
            setTimeout(() => {
                track.style.transition = 'transform 5s cubic-bezier(0.1, 1, 0.1, 1)';
                const itemWidth = 110; 
                const targetOffset = -(40 * itemWidth - (document.querySelector('.roulette-container').clientWidth / 2) + 55);
                track.style.transform = `translateX(${targetOffset}px)`;
            }, 50);

            setTimeout(() => {
                state.inventory.push(winItem);
                saveState();
                alert(`Вы выиграли: ${winItem.name}!`);
                btn.disabled = false;
            }, 5200);
        }

        // Отрисовка инвентаря
        function renderInventory() {
            const container = document.getElementById('inventory-list');
            container.innerHTML = '';
            if (state.inventory.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim);">Инвентарь пуст</p>';
                return;
            }

            state.inventory.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `inventory-item ${item.rarity}`;
                card.innerHTML = `
                    <div>${item.name}</div>
                    <div style="color: var(--accent-color); margin-top:4px;">${item.price}$</div>
                    <button onclick="sellItem(${index})">Продать</button>
                    <button style="background: var(--accent-color); color:#000;" onclick="selectForUpgrade(${index})">Апгрейд</button>
                `;
                container.appendChild(card);
            });
        }

        // Продажа предмета
        function sellItem(index) {
            const item = state.inventory[index];
            state.balance += item.price;
            state.inventory.splice(index, 1);
            saveState();
        }

        // Выбор предмета для апгрейда
        function selectForUpgrade(index) {
            state.selectedUpgraderItem = state.inventory[index];
            document.getElementById('upgrade-selected').innerText = `${state.selectedUpgraderItem.name} (${state.selectedUpgraderItem.price}$)`;
            switchTab('upgrader-tab');
        }

        // Логика апгрейда
        function tryUpgrade() {
            if (!state.selectedUpgraderItem) {
                alert('Сначала выберите предмет в инвентаре!');
                return;
            }

            const itemIndex = state.inventory.indexOf(state.selectedUpgraderItem);
            if (itemIndex === -1) {
                alert('Предмет не найден!');
                return;
            }

            // Удаляем исходный предмет
            state.inventory.splice(itemIndex, 1);

            const success = Math.random() < 0.5;
            if (success) {
                const upgradedItem = {
                    name: `Upgraded ${state.selectedUpgraderItem.name}`,
                    price: Math.round(state.selectedUpgraderItem.price * 1.8),
                    rarity: 'covert'
                };
                state.inventory.push(upgradedItem);
                alert(`Успех! Вы получили ${upgradedItem.name}!`);
            } else {
                alert('Неудача! Предмет сгорел.');
            }

            state.selectedUpgraderItem = null;
            document.getElementById('upgrade-selected').innerText = 'Предмет не выбран';
            saveState();
        }

        // Бонус
        function addBonus() {
            state.balance += 100;
            saveState();
            alert('Вам начислено +100$!');
        }

        // Таймер времени в игре
        setInterval(() => {
            state.timePlayed++;
            document.getElementById('time-played').innerText = state.timePlayed;
            if (state.timePlayed % 10 === 0) {
                saveState();
            }
        }, 1000);

        // Инициализация при запуске
        window.onload = () => {
            renderCases();
            loadState();
        };
    </script>
</body>
    </html>
